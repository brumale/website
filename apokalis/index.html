<script>
const canvas=document.getElementById('gl');
const gl=canvas.getContext('webgl',{antialias:false,alpha:false,premultipliedAlpha:false,powerPreference:'high-performance'});

const vertexSrc=`attribute vec2 position;varying vec2 vUv;void main(){vUv=position*.5+.5;gl_Position=vec4(position,0.,1.);}`;
const fragmentSrc=`
precision highp float;
varying vec2 vUv;
uniform vec2 uRes;
uniform float uTime;

mat2 rot(float a){float s=sin(a),c=cos(a);return mat2(c,-s,s,c);} 
float hash(vec2 p){p=fract(p*vec2(123.34,345.45));p+=dot(p,p+34.345);return fract(p.x*p.y);} 
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);float a=hash(i),b=hash(i+vec2(1.0,0.0)),c=hash(i+vec2(0.0,1.0)),d=hash(i+vec2(1.0,1.0));return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);} 
float fbm(vec2 p){float v=0.0,a=0.5;for(int i=0;i<5;i++){v+=a*noise(p);p=rot(0.45)*p*1.92+vec2(3.7,2.1);a*=0.56;}return v;} 
vec2 flow(vec2 p,float t){vec2 q=vec2(fbm(p+vec2(0.0,t*0.045)),fbm(p+vec2(4.7,-t*0.05)));vec2 r=vec2(fbm(p+q*1.25+vec2(1.7,9.2)+t*0.03),fbm(p+q*1.35+vec2(8.3,2.8)-t*0.028));return q*0.7+r;} 
vec3 palette(float t){vec3 c0=vec3(0.0007,0.0007,0.0008);vec3 c1=vec3(0.006,0.006,0.0065);vec3 c2=vec3(0.034,0.034,0.036);vec3 c3=vec3(0.22,0.22,0.22);vec3 c4=vec3(0.060,0.060,0.062);vec3 c5=vec3(0.115,0.115,0.118);vec3 col=mix(c0,c1,smoothstep(0.02,0.26,t));col=mix(col,c2,smoothstep(0.16,0.52,t)*0.98);col=mix(col,c3,smoothstep(0.54,0.90,t)*0.52);col=mix(col,c4,smoothstep(0.58,0.92,t)*0.12);col=mix(col,c5,smoothstep(0.74,0.995,t)*0.18);return col;} 
float pulseWindow(float x,float a,float b,float blur){return smoothstep(a-blur,a,x)*(1.0-smoothstep(b,b+blur,x));}

void main(){
  vec2 uv=vUv;
  vec2 p=(uv-0.5)*vec2(uRes.x/uRes.y,1.0);
  float t=uTime;

  vec2 base=p*1.15;
  base+=0.10*vec2(sin(t*0.11),cos(t*0.09));
  vec2 warp=flow(base,t);

  float layerA=fbm(base+warp*0.85);
  float layerB=fbm(rot(0.55)*(base*1.55-warp*0.45)-t*0.018);
  float layerC=fbm(rot(-0.35)*(base*2.15+warp*0.22)+t*0.014);

  float liquid=layerA*0.55+layerB*0.30+layerC*0.15;
  liquid=smoothstep(0.18,0.88,liquid);
  float pools=smoothstep(0.26,0.82,fbm(base*0.95-warp*0.60+2.0));
  float swells=smoothstep(0.20,0.90,fbm(rot(0.22)*(base*0.72+warp*0.40)-4.0));
  float field=mix(liquid,pools,0.35);
  field=mix(field,swells,0.22);

  vec3 col=palette(field);

  float ribbon=sin((base.x*1.35-base.y*0.70)+warp.x*2.4+t*0.15);
  ribbon=smoothstep(0.45,0.95,ribbon*0.5+0.5);
  float softSpec=smoothstep(0.56,0.94,field)*0.80+ribbon*0.36;
  col+=vec3(0.92,0.92,0.92)*softSpec*0.68;

  float coolMask=smoothstep(0.50,0.88,layerB)*smoothstep(0.25,0.75,swells);
  float warmMask=smoothstep(0.58,0.94,layerC)*smoothstep(0.35,0.82,pools);
  col+=vec3(0.055,0.055,0.058)*coolMask*0.18;
  col+=vec3(0.050,0.050,0.050)*warmMask*0.12;

  // Black turbulence fill with neutral grey highlights.
  float contrastField=smoothstep(0.004,0.996,field);
  float contourField=smoothstep(0.05,0.96,field);
  float peakField=smoothstep(0.52,0.990,field);
  float troughField=1.0-smoothstep(0.20,0.58,field);
  contrastField=mix(contrastField,contourField,0.90);
  col*=mix(0.045,2.30,contrastField);
  col=mix(col*0.10,col,pow(contrastField,0.42));
  col-=vec3(0.095,0.095,0.095)*pow(max(troughField,0.0),1.40)*1.18;
  col+=vec3(0.28,0.28,0.28)*pow(max(peakField,0.0),1.02)*1.18;
  col=max(col,vec3(0.0));

  // Colorful spotlights / flashes / blobs / drops / swirls, pulsing about every 4 seconds.
  float cycle=fract(t/24.0);
  float pulseBlue=pulseWindow(cycle,0.01,0.20,0.08);
  float pulsePurple=pulseWindow(cycle,0.17,0.36,0.08);
  float pulseRed=pulseWindow(cycle,0.33,0.50,0.06);
  float pulseOrange=pulseWindow(cycle,0.48,0.66,0.06);
  float pulseWhite=pulseWindow(cycle,0.64,0.82,0.06);
  float pulseGold=pulseWindow(cycle,0.80,0.97,0.06);

  vec2 bPos=vec2(-0.82+0.22*sin(t*0.19),0.24+0.18*cos(t*0.23));
  vec2 pPos=vec2(0.18+0.30*sin(t*0.15),0.18+0.24*cos(t*0.12));
  vec2 rPos=vec2(0.78+0.18*cos(t*0.17),-0.18+0.22*sin(t*0.14));
  vec2 oPos=vec2(-0.18+0.42*sin(t*0.11),0.52-0.16*cos(t*0.16));
  vec2 wPos=vec2(0.06+0.26*sin(t*0.21),-0.02+0.16*cos(t*0.18));
  vec2 gPos=vec2(-0.30+0.46*cos(t*0.09),-0.44+0.18*sin(t*0.15));

  float blueSpot=pow(max(0.0,1.0-length((p-bPos)*vec2(0.68,0.84))/1.38),1.45);
  float purpleSpot=pow(max(0.0,1.0-length((p-pPos)*vec2(0.72,0.88))/1.30),1.50);
  float redSpot=pow(max(0.0,1.0-length((p-rPos)*vec2(0.78,0.92))/1.20),1.55);
  float orangeSpot=pow(max(0.0,1.0-length((p-oPos)*vec2(0.72,0.96))/1.15),1.70);
  float whiteSpot=pow(max(0.0,1.0-length((p-wPos)*vec2(0.78,0.78))/1.18),1.60);
  float goldSpot=pow(max(0.0,1.0-length((p-gPos)*vec2(0.76,0.92))/1.18),1.60);

  float blueBeam=smoothstep(0.56,1.0,sin(base.x*1.10-base.y*2.50+warp.x*1.6+t*0.42)*0.5+0.5);
  float purpleBeam=smoothstep(0.60,1.0,sin(base.x*1.62-base.y*1.85+warp.y*1.35+t*0.37)*0.5+0.5);
  float redBeam=smoothstep(0.66,1.0,sin(base.x*1.42+base.y*1.92+warp.y*1.7-t*0.38)*0.5+0.5);
  float orangeBeam=smoothstep(0.67,1.0,sin((base.x-base.y)*2.1+warp.x*1.0+t*0.31)*0.5+0.5);
  float whiteBeam=smoothstep(0.62,1.0,sin(base.x*2.45+base.y*0.72+warp.y*1.3+t*0.58)*0.5+0.5);
  float goldBeam=smoothstep(0.67,1.0,sin(base.x*1.85-base.y*1.55+warp.x*1.1-t*0.29)*0.5+0.5);

  float swirlBlue=smoothstep(0.54,1.0,sin(length(base*1.35+warp*0.55)*7.2-t*0.55)*0.5+0.5);
  float swirlPurple=smoothstep(0.58,1.0,sin(length(rot(0.52)*base*1.28+warp*0.42)*7.0+t*0.46)*0.5+0.5);
  float swirlRed=smoothstep(0.62,1.0,sin(length(rot(0.8)*base*1.1-warp*0.4)*6.4+t*0.48)*0.5+0.5);
  float swirlOrange=smoothstep(0.64,1.0,sin(length(rot(-0.6)*base*1.4+warp*0.35)*6.8-t*0.43)*0.5+0.5);
  float swirlWhite=smoothstep(0.58,1.0,sin(length(rot(0.32)*base*1.6+warp*0.25)*7.6+t*0.63)*0.5+0.5);
  float swirlGold=smoothstep(0.64,1.0,sin(length(rot(-0.22)*base*1.2-warp*0.28)*7.0-t*0.36)*0.5+0.5);

  float dropBlue=pow(max(0.0,1.0-length(p-vec2(bPos.x*0.72,bPos.y-0.18))/0.62),2.05);
  float dropPurple=pow(max(0.0,1.0-length(p-vec2(pPos.x+0.10,pPos.y-0.16))/0.54),2.10);
  float dropRed=pow(max(0.0,1.0-length(p-vec2(rPos.x*0.82,rPos.y+0.14))/0.48),2.3);
  float dropOrange=pow(max(0.0,1.0-length(p-vec2(oPos.x+0.12,oPos.y-0.20))/0.44),2.5);
  float dropWhite=pow(max(0.0,1.0-length(p-vec2(wPos.x-0.14,wPos.y+0.18))/0.46),2.25);
  float dropGold=pow(max(0.0,1.0-length(p-vec2(gPos.x+0.10,gPos.y-0.14))/0.48),2.4);

  float reflectMask=(0.22+0.78*softSpec)*smoothstep(0.26,0.94,field);
  float blueSplash = smoothstep(0.52,1.0,sin(length((base-bPos)*1.9 + warp*0.45)*8.2 - t*0.72)*0.5+0.5);
  blueSplash *= smoothstep(0.46,1.0,sin(base.x*2.4 + base.y*0.8 + warp.x*1.3 + t*0.63)*0.5+0.5);
  vec2 whiteRayVec = p - wPos;
  vec2 purpleRayVec = p - pPos;
  float whiteSunrays = pow(max(0.0,1.0-length(whiteRayVec)/1.95),1.15);
  whiteSunrays *= smoothstep(0.54,1.0,sin(atan(whiteRayVec.y,whiteRayVec.x)*10.0 + t*0.92 + warp.x*1.4)*0.5+0.5);
  float purpleSunrays = pow(max(0.0,1.0-length(purpleRayVec)/1.75),1.18);
  purpleSunrays *= smoothstep(0.58,1.0,sin(atan(purpleRayVec.y,purpleRayVec.x)*8.5 - t*0.78 + warp.y*1.2)*0.5+0.5);
  col += vec3(0.20,0.42,1.00)*blueSplash*pulseBlue*reflectMask*0.62;
  col += vec3(0.16,0.34,0.92)*(blueSpot*1.18+blueBeam*0.92+swirlBlue*0.82+dropBlue*1.26)*pulseBlue*reflectMask*1.55;
  col += vec3(0.60,0.26,0.92)*(purpleSpot*0.96+purpleBeam*0.84+swirlPurple*0.76+dropPurple*1.05)*pulsePurple*reflectMask*1.24;
  col += vec3(0.84,0.74,1.00)*purpleSunrays*pulsePurple*reflectMask*0.52;
  col += vec3(0.70,0.08,0.10)*(redSpot*0.86+redBeam*0.70+swirlRed*0.48+dropRed*0.88)*pulseRed*reflectMask*1.02;
  col += vec3(0.78,0.31,0.04)*(orangeSpot*0.88+orangeBeam*0.66+swirlOrange*0.44+dropOrange*0.92)*pulseOrange*reflectMask*0.98;
  col += vec3(1.00,1.00,0.98)*(whiteSpot*0.88+whiteBeam*0.78+swirlWhite*0.46+dropWhite*1.05)*pulseWhite*reflectMask*0.78;
  col += vec3(1.00,1.00,1.00)*whiteSunrays*pulseWhite*reflectMask*0.60;
  col += vec3(1.00,0.72,0.18)*(goldSpot*0.82+goldBeam*0.62+swirlGold*0.42+dropGold*0.84)*pulseGold*reflectMask*0.72;

  float sheen=sin(base.x*0.9+base.y*0.35+t*0.12+warp.y*2.0)*0.5+0.5;
  sheen=pow(smoothstep(0.64,1.0,sheen),2.0);
  col+=vec3(0.62,0.62,0.62)*sheen*0.56;

  // Final tonal polish: keep the fill black and the highlights silvery.
  col = pow(max(col,vec3(0.0)), vec3(1.08));
  float vignette=smoothstep(1.22,0.26,length((uv-0.5)*vec2(1.22,1.0)));
  col*=0.84+0.16*vignette;

  gl_FragColor=vec4(col,1.0);
}

function makeShader(type,source){const shader=gl.createShader(type);gl.shaderSource(shader,source);gl.compileShader(shader);if(!gl.getShaderParameter(shader,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(shader));return shader;}
const program=gl.createProgram();
gl.attachShader(program,makeShader(gl.VERTEX_SHADER,vertexSrc));
gl.attachShader(program,makeShader(gl.FRAGMENT_SHADER,fragmentSrc));
gl.linkProgram(program);
if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(program));
gl.useProgram(program);
const buffer=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,buffer);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const position=gl.getAttribLocation(program,'position');
gl.enableVertexAttribArray(position);
gl.vertexAttribPointer(position,2,gl.FLOAT,false,0,0);
const uRes=gl.getUniformLocation(program,'uRes');
const uTime=gl.getUniformLocation(program,'uTime');
function resize(){const dpr=Math.min(window.devicePixelRatio||1,1.5);const rect=canvas.getBoundingClientRect();const w=Math.max(1,Math.round(rect.width*dpr));const h=Math.max(1,Math.round(rect.height*dpr));if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;gl.viewport(0,0,w,h);}}
resize();
addEventListener('resize',resize,{passive:true});
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
const start=performance.now();
const specLight=document.getElementById('specLight');
const bevelBlobGroupA=document.getElementById('bevelBlobGroupA');
const bevelBlobGroupB=document.getElementById('bevelBlobGroupB');
const bevelBlobGroupC=document.getElementById('bevelBlobGroupC');

function updateBevel(now){
  const s=(now-start)*0.001;
  if(specLight){
    const az=228 + Math.sin(s*0.11)*18 + Math.sin(s*0.047)*9;
    const el=48 + Math.cos(s*0.09)*8 + Math.sin(s*0.061)*4;
    specLight.setAttribute('azimuth', az.toFixed(2));
    specLight.setAttribute('elevation', el.toFixed(2));
  }
  if(!reduced.matches){
    if(bevelBlobGroupA){
      const tx=Math.sin(s*0.13)*150 + Math.cos(s*0.07)*60;
      const ty=Math.cos(s*0.10)*55 + Math.sin(s*0.05)*28;
      const sc=1.0 + Math.sin(s*0.08)*0.06;
      bevelBlobGroupA.setAttribute('transform', `translate(${tx.toFixed(2)} ${ty.toFixed(2)}) scale(${sc.toFixed(4)})`);
    }
    if(bevelBlobGroupB){
      const tx=Math.cos(s*0.09)*120 + Math.sin(s*0.04)*70;
      const ty=Math.sin(s*0.11)*62 + Math.cos(s*0.06)*24;
      const sc=1.02 + Math.cos(s*0.07)*0.07;
      bevelBlobGroupB.setAttribute('transform', `translate(${tx.toFixed(2)} ${ty.toFixed(2)}) scale(${sc.toFixed(4)})`);
    }
    if(bevelBlobGroupC){
      const tx=Math.sin(s*0.07)*110 - Math.cos(s*0.03)*40;
      const ty=Math.cos(s*0.08)*68 - Math.sin(s*0.05)*22;
      const sc=0.98 + Math.sin(s*0.06)*0.08;
      bevelBlobGroupC.setAttribute('transform', `translate(${tx.toFixed(2)} ${ty.toFixed(2)}) scale(${sc.toFixed(4)})`);
    }
  }
}

function render(now){
  resize();
  const t=reduced.matches?0:(now-start)*0.0032;
  updateBevel(now);
  gl.uniform2f(uRes,canvas.width,canvas.height);
  gl.uniform1f(uTime,t);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  requestAnimationFrame(render);
}
requestAnimationFrame(render);
</script>
</body>
</html>
